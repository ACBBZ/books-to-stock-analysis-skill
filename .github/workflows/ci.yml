name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: books-to-stock-skill validate-skill examples/skills/volume-price-breakout/skill.yaml
      - run: books-to-stock-skill evaluate examples/skills/volume-price-breakout/skill.yaml examples/skills/volume-price-breakout/observation.json
